# Purpose: the component catalogue — the only way domain knowledge about component kinds enters
# SpecAlive. Each IR `kind` maps to its SysML v2 part def and port defs, its Modelica class and
# where that class comes from (msl | specalive | generated), the IR parameter -> Modelica
# parameter mapping, the port role -> connector mapping, required attributes, and defaults with
# the assumption text recorded when a default is used (R-CAT-2). Loaded by core/catalogue.py.
#
# Modelica sources:
#   msl        a Modelica Standard Library 4.x class; checked to exist with omc before listing.
#   specalive  a class in the lightweight SpecAlive component package written by phase 6
#              (ADR "Model representation": constant-flow ideal valves, der(h) = (q_in - q_out)/A).
#   generated  produced per model by generate/controller.py; no fixed class, ports from the IR.

kinds:

  tank:
    description: Open vertical tank; level is the stored volume over a constant cross-section.
    ports:
      inlet: {direction: in, domain: fluid, unit: m3/s}
      outlet: {direction: out, domain: fluid, unit: m3/s}
      level_out: {direction: out, domain: signal_real, unit: m}
    sysml:
      part_def: Tank
      ports: {inlet: FluidPort, outlet: FluidPort, level_out: RealSignal}
    modelica:
      source: specalive
      class: SpecAlive.Components.Tank
      parameters: {area: A, initial_level: h_start}
      connectors: {inlet: inlet, outlet: outlet, level_out: level}
    required: [area]
    defaults:
      initial_level:
        value: 0.0
        unit: m
        assumption: No initial level was stated for the tank; it is assumed to start empty (0 m).

  on_off_valve:
    description: Two-position isolation valve treated as an ideal Boolean flow switch passing its nominal flow when commanded open.
    ports:
      inlet: {direction: in, domain: fluid, unit: m3/s}
      outlet: {direction: out, domain: fluid, unit: m3/s}
      cmd_in: {direction: in, domain: signal_bool}
    sysml:
      part_def: OnOffValve
      ports: {inlet: FluidPort, outlet: FluidPort, cmd_in: BoolSignal}
    modelica:
      source: specalive
      class: SpecAlive.Components.OnOffValve
      parameters: {nominal_flow: q_nominal}
      connectors: {inlet: inlet, outlet: outlet, cmd_in: open}
    required: [nominal_flow]
    defaults: {}

  level_sensor:
    description: Level transmitter passing the measured level to the controller unchanged.
    ports:
      level_in: {direction: in, domain: signal_real, unit: m}
      level_out: {direction: out, domain: signal_real, unit: m}
    # level_in reads the level_out of the part the sensor's evidence names (phase 9).
    measures: {level_in: level_out}
    sysml:
      part_def: LevelSensor
      ports: {level_in: RealSignal, level_out: RealSignal}
    modelica:
      source: msl
      class: Modelica.Blocks.Routing.RealPassThrough
      parameters: {}
      connectors: {level_in: u, level_out: y}
    required: []
    defaults: {}

  command_button:
    description: Momentary operator pushbutton; true for a short pulse at each press time.
    ports:
      cmd_out: {direction: out, domain: signal_bool}
    sysml:
      part_def: CommandButton
      ports: {cmd_out: BoolSignal}
    modelica:
      source: specalive
      class: SpecAlive.Components.CommandButton
      parameters: {press_times: pressTimes}
      connectors: {cmd_out: y}
    required: []
    defaults: {}

  sequence_controller:
    description: Discrete sequence controller generated from the IR state machine it owns.
    ports: {}
    dynamic_ports: true
    sysml:
      part_def: SequenceController
      ports: {}
    modelica:
      source: generated
      parameters: {}
      connectors: {}
    required: []
    defaults: {}

  fluid_source:
    description: Ideal supply boundary; delivers whatever flow downstream draws.
    ports:
      outlet: {direction: out, domain: fluid, unit: m3/s}
    sysml:
      part_def: FluidSource
      ports: {outlet: FluidPort}
    modelica:
      source: specalive
      class: SpecAlive.Components.FluidSource
      parameters: {}
      connectors: {outlet: outlet}
    required: []
    defaults: {}

  fluid_sink:
    description: Ideal drain boundary; accepts whatever flow arrives.
    ports:
      inlet: {direction: in, domain: fluid, unit: m3/s}
    sysml:
      part_def: FluidSink
      ports: {inlet: FluidPort}
    modelica:
      source: specalive
      class: SpecAlive.Components.FluidSink
      parameters: {}
      connectors: {inlet: inlet}
    required: []
    defaults: {}

  # --- continuous feedback pattern (phase 10, FR-10): air volumes with a trace substance, and
  # signal blocks. Every Modelica class is SpecAlive (ADR "L2 plant") or MSL Blocks.

  room_volume:
    description: Well-mixed air volume of constant mass; its trace-substance mass fraction integrates what each inflow brings, the exhaust leaves at the room's fraction.
    ports:
      supply_in: {direction: in, domain: fluid, unit: kg/s}
      source_in: {direction: in, domain: fluid, unit: kg/s}
      exhaust_out: {direction: out, domain: fluid, unit: kg/s}
      concentration_out: {direction: out, domain: signal_real, unit: kg/kg}
    sysml:
      part_def: RoomVolume
      ports: {supply_in: FluidPort, source_in: FluidPort, exhaust_out: FluidPort, concentration_out: RealSignal}
    modelica:
      source: specalive
      class: SpecAlive.Components.RoomVolume
      parameters: {volume: V, density: rho, initial_concentration: C_start}
      connectors: {supply_in: supply, source_in: source, exhaust_out: exhaust, concentration_out: concentration}
    required: [volume, density]
    defaults:
      initial_concentration:
        value: 0.0
        unit: kg/kg
        assumption: No initial trace-substance fraction was stated for the room; it is assumed to start free of it.

  mass_flow_source:
    description: Commanded air supply. Its command is the mass flow at the source's own port, positive into the source (source-port sign convention), so a negative command delivers air to the network; the trace-substance fraction supplied is an input signal.
    ports:
      m_flow_in: {direction: in, domain: signal_real, unit: kg/s}
      c_in: {direction: in, domain: signal_real, unit: kg/kg}
      outlet: {direction: out, domain: fluid, unit: kg/s}
    sysml:
      part_def: MassFlowSource
      ports: {m_flow_in: RealSignal, c_in: RealSignal, outlet: FluidPort}
    modelica:
      source: specalive
      class: SpecAlive.Components.MassFlowSource
      parameters: {}
      connectors: {m_flow_in: m_flow_in, c_in: C_in, outlet: outlet}
    required: []
    defaults: {}

  trace_substance_source:
    description: Injects a commanded carrier flow at a fixed trace-substance mass fraction; the substance added is the carrier flow times that fraction, which may be a scaling device rather than a physical composition.
    ports:
      m_flow_in: {direction: in, domain: signal_real, unit: kg/s}
      outlet: {direction: out, domain: fluid, unit: kg/s}
    sysml:
      part_def: TraceSubstanceSource
      ports: {m_flow_in: RealSignal, outlet: FluidPort}
    modelica:
      source: specalive
      class: SpecAlive.Components.TraceSource
      parameters: {concentration: C}
      connectors: {m_flow_in: m_flow_in, outlet: outlet}
    required: [concentration]
    defaults: {}

  pressure_boundary:
    description: Ideal boundary that accepts whatever air flow arrives; no pressure dynamics.
    ports:
      inlet: {direction: in, domain: fluid, unit: kg/s}
    sysml:
      part_def: PressureBoundary
      ports: {inlet: FluidPort}
    modelica:
      source: specalive
      class: SpecAlive.Components.Boundary
      parameters: {}
      connectors: {inlet: inlet}
    required: []
    defaults: {}

  concentration_sensor:
    description: Ideal concentration sensor passing the measured trace-substance mass fraction on unchanged.
    ports:
      c_in: {direction: in, domain: signal_real, unit: kg/kg}
      c_out: {direction: out, domain: signal_real, unit: kg/kg}
    # c_in reads the concentration_out of the volume the sensor's evidence names.
    measures: {c_in: concentration_out}
    sysml:
      part_def: ConcentrationSensor
      ports: {c_in: RealSignal, c_out: RealSignal}
    modelica:
      source: msl
      class: Modelica.Blocks.Routing.RealPassThrough
      parameters: {}
      connectors: {c_in: u, c_out: y}
    required: []
    defaults: {}

  gain:
    description: Signal gain, y = k * u; the unit of k converts the input's unit to the output's.
    ports:
      u: {direction: in, domain: signal_real}
      y: {direction: out, domain: signal_real}
    sysml:
      part_def: Gain
      ports: {u: RealSignal, y: RealSignal}
    modelica:
      source: msl
      class: Modelica.Blocks.Math.Gain
      parameters: {gain: k}
      connectors: {u: u, y: y}
    required: [gain]
    defaults: {}

  constant:
    description: Constant signal, such as a setpoint or a fixed boundary value.
    ports:
      y: {direction: out, domain: signal_real}
    sysml:
      part_def: ConstantSignal
      ports: {y: RealSignal}
    modelica:
      source: msl
      class: Modelica.Blocks.Sources.Constant
      parameters: {value: k}
      connectors: {y: y}
    required: [value]
    defaults: {}

  p_controller:
    description: Proportional controller with bias and output limits, command = limit(bias + gain * (measurement - setpoint)); no integral term.
    ports:
      setpoint_in: {direction: in, domain: signal_real}
      measurement_in: {direction: in, domain: signal_real}
      command_out: {direction: out, domain: signal_real}
    sysml:
      part_def: PController
      ports: {setpoint_in: RealSignal, measurement_in: RealSignal, command_out: RealSignal}
    modelica:
      source: specalive
      class: SpecAlive.Components.PController
      parameters: {gain: k, bias: bias, output_min: yMin, output_max: yMax}
      connectors: {setpoint_in: u_s, measurement_in: u_m, command_out: y}
    required: [gain, output_min, output_max]
    defaults:
      bias:
        value: 0.0
        unit: "1"
        assumption: No controller bias was stated; the output is assumed to be zero when the measurement equals the setpoint.

  schedule_table:
    description: Piecewise-constant schedule; each value holds from its time until the next.
    ports:
      y: {direction: out, domain: signal_real}
    sysml:
      part_def: ScheduleTable
      ports: {y: RealSignal}
    modelica:
      source: specalive
      class: SpecAlive.Components.ScheduleTable
      parameters: {times: times, values: values}
      connectors: {y: y}
    required: [times, values]
    defaults: {}
