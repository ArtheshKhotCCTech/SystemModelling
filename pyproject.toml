# Purpose: package metadata for SpecAlive — runtime and [dev] dependencies, and the `specalive`
# console script that exposes the CLI in specalive/cli.py.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specalive"
version = "0.1.0"
description = "Messy engineering inputs to a traced IR, a SysML v2 model and a compiling Modelica model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
specalive = "specalive.cli:main"

[tool.setuptools.packages.find]
include = ["specalive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs an external tool end to end (seconds to minutes)",
]
